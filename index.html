<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#CDB8E8">
<meta name="description" content="Membresías de café: el socio ve su tarjeta de consumo y cada cafetería registra el café del día.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VentiunGo">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>VentiunGo · Socios Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: portada de servicio (tesis + tarjeta de socio con el logo de la cafetería) → cómo funciona → planes → cafeterías adheridas; el registro y el panel de cada cafetería se abren en la misma página. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F2F9; --line:#E5E0EC;
  --ink:#2A2730; --muted:#6B6575;
  --accent:#CDB8E8; --on-accent:#2A2730; --ring:#8A73C4; --crema:#E8935F; --hl:#FFE2CF; --hl-ink:#2A2730;
  --c-clasica:#8EC3E6; --c-premium:#F2B985; --ch-c:#3D7FB8; --ch-p:#C7782C;
  --ok:#2F6B45; --ok-bg:#DDF3E4; --warn:#7A5A00; --warn-bg:#FFF1CC; --bad:#A33A3A; --bad-bg:#FCE1E1;
  --scrim:rgba(20,16,26,.45);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#0F0E11; --surface-2:#1B191F; --line:#2D2A32;
    --ink:#F3EFF7; --muted:#A8A1B1;
    --accent:#CDB8E8; --on-accent:#1F1A26; --ring:#CDB8E8; --crema:#F2A97A; --hl:#F6CDB0; --hl-ink:#1F1A26;
    --c-clasica:#A9D3F0; --c-premium:#F5C9A0; --ch-c:#4A90D9; --ch-p:#C47528;
    --ok:#9EDDB3; --ok-bg:#12261A; --warn:#F5D98A; --warn-bg:#2A230F; --bad:#F2A7A7; --bad-bg:#2E1515;
    --scrim:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#000000; --surface:#0F0E11; --surface-2:#1B191F; --line:#2D2A32;
    --ink:#F3EFF7; --muted:#A8A1B1;
    --accent:#CDB8E8; --on-accent:#1F1A26; --ring:#CDB8E8; --crema:#F2A97A; --hl:#F6CDB0; --hl-ink:#1F1A26;
    --c-clasica:#A9D3F0; --c-premium:#F5C9A0; --ch-c:#4A90D9; --ch-p:#C47528;
    --ok:#9EDDB3; --ok-bg:#12261A; --warn:#F5D98A; --warn-bg:#2A230F; --bad:#F2A7A7; --bad-bg:#2E1515;
    --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
body{font-family:var(--body);font-size:15px;line-height:1.5;background:var(--bg);color:var(--ink);
  padding-block:18px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(34px,6vw,62px);line-height:1.02;font-weight:700;letter-spacing:-.035em}
h2{font-size:clamp(24px,3.4vw,32px);font-weight:650}
h3{font-size:17px;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* encabezado */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;font:inherit}
.brand svg{flex:none}
.brand b{font:700 21px/1 var(--display);letter-spacing:-.02em}
.brand .bt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
.go{color:var(--accent)}
.brand small{font-size:12px;line-height:1;font-weight:600;color:var(--muted);letter-spacing:.02em}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.theme button{border:0;background:none;color:var(--muted);padding:5px 12px;border-radius:999px;font:500 13px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.theme button:hover{color:var(--ink)}
.theme button i{width:11px;height:11px;border-radius:50%;border:1px solid var(--muted)}
.theme button[data-th="light"] i{background:#fff} .theme button[data-th="dark"] i{background:#000}
.theme button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}

.logo{width:var(--s,44px);height:var(--s,44px);border-radius:50%;flex:none;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);display:inline-grid;place-items:center;font:700 calc(var(--s,44px)*.38) var(--display);color:var(--muted);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}

/* botones y campos */
.btn{height:42px;padding:0 16px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.15)}
.btn.lg{height:52px;padding:0 22px;font-size:16px;font-weight:700}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:4px;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}
.link:hover{color:var(--ink)}
:is(.btn,.link,.brand,.tab,input,select,textarea,button):focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.inp{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:inherit}
.inp.xl{height:54px;font-size:18px}
.field{display:flex;flex-direction:column;min-width:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .full{grid-column:1/-1}
.help{font-size:13px;color:var(--muted);margin-top:5px}
.ferr{color:var(--bad);font-size:14px;min-height:20px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 8px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:500;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--plan)}
.clasica{--plan:var(--c-clasica)} .premium{--plan:var(--c-premium)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.tag-ej{display:inline-block;padding:1px 7px;border-radius:4px;border:1px dashed var(--muted);font:700 11px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.note{padding:12px 14px;border-radius:8px;background:var(--warn-bg);border:1px solid var(--line);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}

/* portada */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center;padding-top:20px}
.hero-copy{display:flex;flex-direction:column;gap:20px;min-width:0}
.hero-copy h1 em{font-style:normal;color:var(--hl-ink);background:var(--hl);border-radius:.18em;padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.lead{font-size:18px;max-width:52ch;color:var(--muted)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.facts{display:flex;gap:22px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.facts b{display:block;font:600 22px/1.1 var(--display);color:var(--ink)}

/* tarjeta de socio */
.memb{position:relative;border-radius:18px;padding:22px;background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;gap:18px;max-width:440px;width:100%;justify-self:center;box-shadow:0 24px 50px -24px rgba(0,0,0,.45)}
.memb .row1{display:flex;align-items:center;gap:12px}
.memb .row1 .logo{--s:52px;border-color:transparent}
.memb .cn{font:700 20px/1.1 var(--display);overflow-wrap:anywhere}
.memb .cs{font-size:13px;opacity:.75}
.memb .socio{font:600 26px/1.1 var(--display);letter-spacing:-.02em}
.memb .meta{display:flex;justify-content:space-between;gap:10px;font:500 12px var(--mono);opacity:.8;flex-wrap:wrap}
.memb .tag-ej{position:absolute;top:14px;right:14px;border-color:currentColor;color:inherit;opacity:.7}
.cups{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.cups span{aspect-ratio:1;border-radius:50%;border:1.5px solid currentColor;opacity:.35;max-width:100%}
.cups span.u{opacity:1;background:currentColor;box-shadow:inset 0 0 0 3px var(--accent)}
.cups.long{grid-template-columns:repeat(30,1fr);gap:3px}
.cups.long span{border-width:1px}
.cups.long span.t{outline-offset:1px}
.cups span.f{border-style:dashed;opacity:.3}
.cups span.t{opacity:1;outline:2px solid var(--crema);outline-offset:2px}
.memb .st{position:absolute;top:14px;right:14px;padding:2px 9px;border-radius:999px;font:700 11px var(--body);letter-spacing:.05em;text-transform:uppercase;background:var(--on-accent);color:var(--accent)}
.memb .st.bad{background:var(--bad-bg);color:var(--bad)}
.memb .tel{font:500 13px var(--mono);opacity:.75}
.ficha{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
.legend i.u{background:var(--ink)} .legend i.f{border-style:dashed;opacity:.5} .legend i.n{opacity:.4} .legend i.t{outline:2px solid var(--crema);outline-offset:1px}
@media (max-width:880px){.ficha{grid-template-columns:minmax(0,1fr)}}

/* pasos */
.sec{display:flex;flex-direction:column;gap:22px}
.sec-h{display:flex;flex-direction:column;gap:8px;max-width:640px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;counter-reset:s}
.steps li{counter-increment:s;padding-top:16px;border-top:2px solid var(--ink);display:flex;flex-direction:column;gap:8px}
.steps li::before{content:"Paso " counter(s);font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.plan{display:flex;flex-direction:column;gap:10px;border-top:6px solid var(--plan)}
.plan ul{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.dir .item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;min-width:0}
.dir .item div{min-width:0}
.dir .item b{display:block;overflow-wrap:anywhere}
.empty{padding:22px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.join{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:28px;border-radius:14px;background:var(--surface-2)}

/* registro */
.form-wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:start}
.logo-pick{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-pick .logo{--s:84px}
.preview-side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px}

/* panel */
.panel-h{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.panel-h .id{display:flex;align-items:center;gap:14px;min-width:0}
.panel-h .id .logo{--s:64px}
.panel-h h1{font-size:clamp(26px,4vw,38px)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:11px 16px;font:500 15px var(--body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.result{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.result:hover{background:var(--surface-2)}
.result small{grid-column:1/-1;color:var(--muted);font-size:13px}
.result b{overflow-wrap:anywhere}
.done{display:flex;gap:12px;align-items:center;padding:14px;border-radius:8px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.big-n{font:700 52px/1 var(--display);letter-spacing:-.03em}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.scroll{overflow-x:auto}
.tbl{width:100%;min-width:640px;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
#toast{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:40;padding:0 16px}
#toast div{pointer-events:auto;max-width:520px;padding:12px 18px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500}
#toast div.err{background:var(--bad);color:var(--bad-bg)}

.benef{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.benef .b{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:12px;background:var(--surface-2)}
.benef .b h3{font-size:18px}
.benef .b.star{grid-column:span 2;background:var(--hl);color:var(--hl-ink)}
.benef .b.star p{color:var(--hl-ink);opacity:.85}
.extras{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.extras span{padding:5px 12px;border-radius:999px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;border:1px solid var(--line)}
.est{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
.est .fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.est-out b{display:block;font:700 clamp(34px,5vw,48px)/1 var(--display);letter-spacing:-.03em}
@media (max-width:880px){.benef{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.est{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.benef{grid-template-columns:minmax(0,1fr)}.benef .b.star{grid-column:auto}.est .fgrid{grid-template-columns:minmax(0,1fr)}}
.store-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding:24px;border-radius:16px;background:var(--surface-2)}
.store-h .logo{--s:96px}
.store-h h1{font-size:clamp(30px,5vw,48px)}
.store-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);margin-top:6px}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.perk{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:12px;border:1px solid var(--line)}
.perk.hi{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.perk.hi p{color:var(--hl-ink);opacity:.85}
.perk p{color:var(--muted);font-size:14px}
.pricebig{font:700 28px/1.1 var(--display);letter-spacing:-.02em}
.acc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.dir .item{cursor:pointer;background:var(--surface);color:var(--ink);font:inherit;text-align:left;width:100%}
.dir .item:hover{background:var(--surface-2)}
@media (max-width:560px){.store-h{grid-template-columns:minmax(0,1fr)}.store-h .logo{--s:72px}.acc{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.kpi b{display:block;font:700 clamp(26px,3vw,34px)/1.1 var(--display);white-space:nowrap;letter-spacing:-.025em;margin-top:6px}
.kpi span{font-size:13px;color:var(--muted)}
.chart-wrap{overflow-x:auto;position:relative}
.chart-wrap svg{display:block;min-width:620px;width:100%;height:auto}
.ch-c{fill:var(--ch-c)} .ch-p{fill:var(--ch-p)}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font:11px var(--mono)}
.hit{fill:transparent;cursor:default}
.hit:hover{fill:var(--line);fill-opacity:.35}
.legend2{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 i{width:12px;height:12px;border-radius:3px;display:inline-block}
#ch-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);z-index:3}
.bar-h{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.bar-h .t{height:12px;border-radius:0 4px 4px 0;background:var(--ch-c);min-width:2px}
.usem{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--surface-2);vertical-align:middle;margin-right:8px;overflow:hidden}
.usem b{display:block;height:100%;background:var(--ch-c)}
@media (max-width:880px){
  .hero,.form-wrap,.split{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:minmax(0,1fr)}
  .preview-side{position:static}
}
@media (max-width:560px){
  .fgrid,.plans{grid-template-columns:minmax(0,1fr)}
  .join{grid-template-columns:minmax(0,1fr)}
  .wrap{gap:44px}
}
@media (prefers-reduced-motion:no-preference){
  .memb{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
  .memb .cups span.u{animation:fill .35s ease both;animation-delay:calc(var(--i)*60ms + .3s)}
  @keyframes rise{from{transform:translateY(14px) rotate(-1.5deg)}to{transform:none}}
  @keyframes fill{from{transform:scale(.4)}to{transform:none}}
}

/* salón y mesas */
.sl-modos,.sl-secs{display:flex;gap:8px;flex-wrap:wrap}
.chip-b{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px var(--body);cursor:pointer}

<script>
/* ===== VentiunGo · Suscripciones: 2 meses gratis y los mismos planes que ventiungo.ar ===== */
window.VGSubs = (function () {
  var DAY = 864e5, TRIAL_DAYS = 60, WA_DEF = '5493415628884';
  // Igual que la sección "Planes y precios" de ventiungo.ar (los precios y descuentos se pueden cambiar desde soporte)
  var DEF = {
    moneda: 'USD',
    periodos: [{ id: 'mes', nombre: 'Mensual', meses: 1, desc: 0 }, { id: 'tri', nombre: 'Trimestral', meses: 3, desc: 10 }, { id: 'anio', nombre: 'Anual', meses: 12, desc: 25 }],
    funciones: ['Soporte especializado', 'Registro de ventas', 'Registro de gastos', 'Registro de inventarios', 'Módulo de estadísticas',
      'Descarga de comprobantes', 'Descarga de reportes', 'Gestión de clientes', 'Gestión de proveedores', 'Variación de productos', 'Control de deudas',
      'Creación de recetas', 'Uso desde el celular', 'Uso desde la computadora', 'Documento electrónico'],
    planes: [
      { id: 'esencial', nombre: 'Esencial (App)', icono: '📱', base: 9.99, recomendado: false, cinta: '', no: ['Creación de recetas', 'Uso desde la computadora', 'Documento electrónico'] },
      { id: 'pro', nombre: 'Pro (App + Web)', icono: '💻', base: 19.99, recomendado: true, cinta: 'Recomendado para emprendedores', no: ['Documento electrónico'] }
    ]
  };
  var APPS = { peluquerias: 'VentiunGo Peluquerías', sociocafe: 'Socios Café' };
  var cur = null, cfg = null, cfgP = null, blockEl = null, pillEl = null, periodo = 'anio', elegido = '';

  function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(n) { return (Number(n) || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fdate(ms) { return ms ? new Date(ms).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—'; }
  function tms(v) { if (!v) return 0; if (typeof v === 'number') return v; if (v.toMillis) return v.toMillis(); if (v.seconds) return v.seconds * 1000; var d = Date.parse(v); return isNaN(d) ? 0 : d; }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
  function addMonths(ms, m) { var d = new Date(ms); var day = d.getDate(); d.setMonth(d.getMonth() + m); if (d.getDate() < day) d.setDate(0); return d.getTime(); }
  function ts(ms) { return firebase.firestore.Timestamp.fromMillis(ms); }

  // Planes vigentes: los de la web + lo que soporte haya cambiado en config/planes
  function cat() {
    var c = cfg || {};
    return {
      moneda: c.moneda || DEF.moneda,
      periodos: DEF.periodos.map(function (p) { var o = (c.periodos || {})[p.id] || {}; return Object.assign({}, p, { desc: o.desc != null && o.desc !== '' ? Number(o.desc) : p.desc }); }),
      planes: DEF.planes.map(function (p) { var o = (c.planes || {})[p.id] || {}; return Object.assign({}, p, { base: o.base != null && o.base !== '' ? Number(o.base) : p.base }); }),
      funciones: DEF.funciones,
      links: c.links || {}
    };
  }
  function planLabel(key) {
    var k = String(key || '').split('_'), c = cat();
    var pl = c.planes.filter(function (x) { return x.id === k[0]; })[0], pe = c.periodos.filter(function (x) { return x.id === k[1]; })[0];
    return pl ? pl.nombre + (pe ? ' · ' + pe.nombre : '') : String(key || '');
  }

  function css() {
    if (document.getElementById('vgs-css')) return;
    var s = document.createElement('style'); s.id = 'vgs-css';
    s.textContent = [
      '.vgs-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(42,39,48,.62);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 16px;font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;color-scheme:light}',
      '.vgs-card{--bg:#fff;--soft:#F5F2F9;--line:#E5E0EC;--ink:#2A2730;--muted:#6B6575;--accent:#CDB8E8;--accent-strong:#9C7FD0;--dark:#2A2730;background:var(--bg);color:var(--ink);border-radius:22px;max-width:900px;width:100%;margin:auto;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}',
      '.vgs-card h2{margin:0 0 4px;font-size:24px;line-height:1.2;letter-spacing:-.01em}.vgs-card p{margin:0}.vgs-mut{color:var(--muted);font-size:14px}',
      '.vgs-eyebrow{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:6px}',
      '.vgs-alert{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:14px}',
      '.vgs-center{text-align:center}',
      '.vgs-billing{display:flex;width:max-content;max-width:100%;margin:18px auto 22px;padding:5px;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:14px}',
      '.vgs-billing button{font:inherit;font-size:15px;font-weight:600;border:0;background:none;color:var(--muted);padding:9px 16px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}',
      '.vgs-billing button.on{background:var(--dark);color:#fff}.vgs-billing .off{font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px;background:#2E8B57;color:#fff}',
      '.vgs-plans{display:grid;grid-template-columns:repeat(2,minmax(0,400px));justify-content:center;gap:22px;align-items:start}',
      '.vgs-p2{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 4px 18px rgba(42,39,48,.07)}',
      '.vgs-p2.rec{border:2px solid var(--accent-strong);box-shadow:0 10px 30px rgba(42,39,48,.10)}',
      '.vgs-p2 .ribbon{background:var(--accent);text-align:center;font-size:13px;font-weight:700;padding:8px}',
      '.vgs-p2 .in{padding:24px 24px 26px}',
      '.vgs-p2 h3{margin:0;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px}',
      '.vgs-p2 .was{text-align:center;color:var(--muted);text-decoration:line-through;font-size:15px;margin-top:14px;min-height:22px}',
      '.vgs-p2 .now{text-align:center;font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1}',
      '.vgs-p2 .now small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}',
      '.vgs-p2 .tot{text-align:center;font-size:13px;color:var(--muted);min-height:20px;margin-top:4px}',
      '.vgs-p2 ul{list-style:none;padding:18px 0 0;margin:18px 0 22px;border-top:1px solid var(--line);display:grid;gap:9px;font-size:14.5px}',
      '.vgs-p2 li{display:flex;gap:10px;align-items:center}',
      '.vgs-p2 li::before{content:"✓";flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:#E3F1EA;color:#2E8B57}',
      '.vgs-p2 li.no{color:var(--muted)}.vgs-p2 li.no::before{content:"✕";background:#FBE4E4;color:#C0392B}',
      '.vgs-btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border:1.5px solid var(--dark);background:var(--dark);color:#fff;transition:transform .15s,box-shadow .15s}',
      '.vgs-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(42,39,48,.15)}',
      '.vgs-btn.accent{background:var(--accent);border-color:var(--accent);color:var(--ink)}.vgs-btn.light{background:#fff;color:var(--ink)}',
      '.vgs-btn.wide{width:100%}.vgs-btn.sm{padding:7px 12px;font-size:13.5px}',
      '.vgs-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.vgs-sep{border:0;border-top:1px solid var(--line);margin:18px 0}',
      '.vgs-in{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;background:#fff;color:var(--ink);min-width:0}',
      '.vgs-kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:12px 0}.vgs-kv span:nth-child(odd){color:var(--muted)}',
      '.vgs-badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}.vgs-b-prueba{background:#dbeafe;color:#1d4ed8}.vgs-b-activo{background:#d1fae5;color:#047857}.vgs-b-vencido{background:#ffe4e6;color:#be123c}.vgs-b-nuevo{background:#f1f5f9;color:#475569}',
      '.vgs-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:9990;background:#2A2730;color:#fff;border:0;border-radius:99px;padding:9px 16px;font:600 13px/1.2 system-ui,-apple-system,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer;max-width:calc(100vw - 32px)}',
      '.vgs-pill b{color:#CDB8E8}',
      '.vgs-x{float:right;background:none;border:0;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:0 0 0 8px}',
      '.vgs-msg{font-size:13.5px;margin-top:10px;min-height:1em}.vgs-msg.err{color:#C0392B}.vgs-msg.ok{color:#2E8B57}',
      '.vgs-tbl{width:100%;border-collapse:collapse;font-size:13px}.vgs-tbl td,.vgs-tbl th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}',
      '@media (max-width:760px){.vgs-plans{grid-template-columns:minmax(0,460px)}.vgs-card{padding:20px 16px}}',
      '@media (max-width:480px){.vgs-billing button{padding:8px 10px;font-size:14px}.vgs-billing .off{display:none}.vgs-p2 .now{font-size:32px}}'
    ].join('\n');
    document.head.appendChild(s);
  }
  function modal(inner, opt) {
    css(); opt = opt || {};
    var ov = document.createElement('div'); ov.className = 'vgs-ov';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    ov.innerHTML = '<div class="vgs-card">' + inner + '</div>';
    if (!opt.blocking) ov.addEventListener('click', function (ev) { if (ev.target === ov || ev.target.closest('[data-vgs-close]')) close(); });
    document.body.appendChild(ov);
    function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); if (opt.onClose) opt.onClose(); }
    return { el: ov, close: close, set: function (html) { ov.querySelector('.vgs-card').innerHTML = html; } };
  }

  // ---------- estado ----------
  function compute(d) {
    d = d || {};
    var start = tms(d.trialStart) || Date.now();
    var trialEnd = start + (TRIAL_DAYS + (Number(d.trialExtra) || 0)) * DAY;
    var paid = tms(d.paidUntil), now = Date.now();
    var state = paid > now ? 'activo' : trialEnd > now ? 'prueba' : 'vencido';
    var end = state === 'activo' ? paid : trialEnd;
    return { state: state, trialStart: start, trialEnd: trialEnd, paidUntil: paid, plan: d.plan || '', days: Math.max(0, Math.ceil((end - now) / DAY)), end: end, pagos: d.pagos || [] };
  }
  function plain(d) { var o = {}; for (var k in d) { if (k === 'pagos') continue; var v = d[k]; o[k] = (v && (v.toMillis || v.seconds)) ? tms(v) : v; } return o; }
  function loadCfg(db, force) {
    if (cfg && !force) return Promise.resolve(cfg);
    if (cfgP && !force) return cfgP;
    cfgP = db.collection('config').doc('planes').get().then(function (sn) { cfg = sn.exists ? sn.data() : {}; cfgP = null; return cfg; }, function () { cfgP = null; cfg = cfg || {}; return cfg; });
    return cfgP;
  }
  function waNum() { return String((cfg && cfg.whatsapp) || WA_DEF).replace(/\D/g, ''); }
  function wa(text) { window.open('https://wa.me/' + waNum() + '?text=' + encodeURIComponent(text), '_blank'); }

  // ---------- ventana de planes (igual a ventiungo.ar) ----------
  function plansHTML(o, st, blocking) {
    var c = cat(), p = c.periodos.filter(function (x) { return x.id === periodo; })[0] || c.periodos[2];
    var aviso = blocking
      ? '<div class="vgs-alert"><b>Terminó tu prueba gratis de 2 meses.</b> Para seguir usando ' + h(APPS[o.app]) + ' en <b>' + h(o.nombre) + '</b>, elegí un plan. Tus datos quedan guardados y la cuenta se habilita apenas se acredita el pago.</div>'
      : (st && st.state === 'prueba' ? '<div class="vgs-alert">🎁 Te quedan <b>' + st.days + ' día' + (st.days === 1 ? '' : 's') + '</b> de prueba gratis (hasta el ' + fdate(st.trialEnd) + ').</div>'
        : st && st.state === 'activo' ? '<div class="vgs-alert">✅ Tu plan' + (st.plan ? ' <b>' + h(planLabel(st.plan)) + '</b>' : '') + ' está activo hasta el <b>' + fdate(st.paidUntil) + '</b>. Podés renovarlo cuando quieras.</div>' : '');
    var tabs = c.periodos.map(function (x) {
      return '<button type="button" role="tab" data-vgs-per="' + x.id + '" class="' + (x.id === p.id ? 'on' : '') + '" aria-selected="' + (x.id === p.id) + '">' + h(x.nombre) + (x.desc ? '<span class="off">-' + x.desc + '%</span>' : '') + '</button>';
    }).join('');
    var cards = c.planes.map(function (pl) {
      var mes = pl.base * (1 - p.desc / 100);
      return '<article class="vgs-p2' + (pl.recomendado ? ' rec' : '') + '">' + (pl.cinta ? '<div class="ribbon">' + h(pl.cinta) + '</div>' : '') +
        '<div class="in"><h3><span>' + pl.icono + '</span>' + h(pl.nombre) + '</h3>' +
        '<div class="was">' + (p.desc ? '$ ' + num(pl.base) + ' ' + h(c.moneda) + '/mes' : '') + '</div>' +
        '<div class="now">$ ' + num(mes) + ' <small>' + h(c.moneda) + '/mes</small></div>' +
        '<div class="tot">' + (p.meses > 1 ? 'Total a pagar por ' + (p.meses === 12 ? 'año' : 'trimestre') + ': $ ' + num(mes * p.meses) : 'Se cobra mes a mes') + '</div>' +
        '<ul>' + c.funciones.map(function (f) { return pl.no.indexOf(f) >= 0 ? '<li class="no">No incluye ' + h(f.charAt(0).toLowerCase() + f.slice(1)) + '</li>' : '<li>' + h(f) + '</li>'; }).join('') + '</ul>' +
        '<button class="vgs-btn wide ' + (pl.recomendado ? 'accent' : '') + '" data-vgs-pay="' + pl.id + '">' + (c.links[pl.id + '_' + p.id] ? '💳 Pagar ' + h(p.nombre.toLowerCase()) : 'Elegir plan') + '</button></div></article>';
    }).join('');
    return (blocking ? '' : '<button class="vgs-x" data-vgs-close aria-label="Cerrar">×</button>') + aviso +
      '<div class="vgs-center"><span class="vgs-eyebrow">Planes y precios</span><h2>Elegí el plan para tu negocio</h2><p class="vgs-mut" style="font-size:16px">Pagá por mes, por trimestre o por año y ahorrá.</p></div>' +
      '<div class="vgs-billing" role="tablist">' + tabs + '</div><div class="vgs-plans">' + cards + '</div>' +
      '<p class="vgs-mut vgs-center" style="margin-top:16px">Pagás con <b>Mercado Pago</b>: tarjeta de crédito, débito o dinero en cuenta.</p>' +
      '<hr class="vgs-sep"><div class="vgs-row" style="justify-content:center">' +
      '<button class="vgs-btn light sm" data-vgs-paid>✅ Ya pagué: avisar por WhatsApp</button>' +
      (blocking ? '<button class="vgs-btn light sm" data-vgs-recheck>↻ Ya me activaron</button><button class="vgs-btn light sm" data-vgs-logout>Cerrar sesión</button>' : '<button class="vgs-btn light sm" data-vgs-close>Cerrar</button>') +
      '</div><p class="vgs-msg vgs-center" data-vgs-msg></p>';
  }
  function bindPlans(m, o, st, blocking) {
    var el = m.el;
    el.querySelectorAll('[data-vgs-per]').forEach(function (b) {
      b.onclick = function () { periodo = b.getAttribute('data-vgs-per'); m.set(plansHTML(o, st, blocking)); bindPlans(m, o, st, blocking); };
    });
    el.querySelectorAll('[data-vgs-pay]').forEach(function (b) {
      b.onclick = function () {
        var key = b.getAttribute('data-vgs-pay') + '_' + periodo, link = cat().links[key];
        elegido = key;
        if (link && /^https?:\/\//.test(link)) {
          window.open(link, '_blank');
          var msg = el.querySelector('[data-vgs-msg]'); if (msg) { msg.className = 'vgs-msg ok vgs-center'; msg.textContent = 'Cuando termines de pagar, tocá "Ya pagué" para avisarnos y activamos tu cuenta.'; }
        } else wa('Hola VentiunGo, quiero el plan ' + planLabel(key) + ' de ' + APPS[o.app] + ' para ' + o.nombre + '. ¿Me pasan el link de pago?');
      };
    });
    var pd = el.querySelector('[data-vgs-paid]'); if (pd) pd.onclick = function () { wa('Hola VentiunGo, ya pagué la suscripción de ' + APPS[o.app] + ' para ' + o.nombre + (elegido ? ' (plan ' + planLabel(elegido) + ')' : '') + '. Código: ' + o.sid + '. ¿Me activan la cuenta? Te mando el comprobante.'); };
    var rc = el.querySelector('[data-vgs-recheck]'); if (rc) rc.onclick = function () {
      var msg = el.querySelector('[data-vgs-msg]'); if (msg) { msg.className = 'vgs-msg vgs-center'; msg.textContent = 'Revisando…'; }
      o.db.collection('suscripciones').doc(o.sid).get().then(function (sn) { if (sn.exists) onData(sn.data()); if (cur && cur.st && cur.st.state === 'vencido' && msg) { msg.className = 'vgs-msg err vgs-center'; msg.textContent = 'Todavía no figura el pago. Si ya pagaste, avisanos por WhatsApp.'; } }, function () { if (msg) { msg.className = 'vgs-msg err vgs-center'; msg.textContent = 'No se pudo revisar. Probá de nuevo.'; } });
    };
    var lo = el.querySelector('[data-vgs-logout]'); if (lo) lo.onclick = function () { hideBlock(); if (o.onLogout) o.onLogout(); };
  }
  function showPlans(o, st, blocking) {
    o = o || (cur && cur.opts); if (!o) return;

var LEGEND='<div class="legend"><span><i class="u"></i>Café entregado</span><span><i class="n"></i>Sin canjear</span><span><i class="f"></i>Por venir</span><span><i class="t"></i>Hoy</span></div>';
function newCode(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r='';var b=new Uint8Array(6);try{crypto.getRandomValues(b)}catch(_){for(var i=0;i<6;i++)b[i]=Math.random()*256}for(var j=0;j<6;j++)r+=a[b[j]%a.length];return r}
function memGet(){try{return JSON.parse(localStorage.getItem(MK))||null}catch(_){return null}}
function memPut(o){try{if(o)localStorage.setItem(MK,JSON.stringify(o));else localStorage.removeItem(MK)}catch(_){}}
function loadMember(cafe,code){
  var M=S.member;M.cafe=cafe;M.code=code;M.err='';M.busy=true;M.card=null;
  if(unsubT){unsubT();unsubT=null}
  if(!DB){M.busy=false;M.err='Para ver tu tarjeta necesitás abrir VentiunGo con la cuenta a la que la cafetería te compartió la página.';render();return}
  M.cafeData=S.dir.find(function(c){return c.id===cafe})||null;
  if(!M.cafeData)DB.doc('cafes/'+ownerOf(cafe)).get().then(function(sn){var pc=sn.exists&&pickCafe(cafe,sn.data());if(pc){M.cafeData=pc;render()}},function(){});
  try{
    unsubT=DB.doc(tPath(cafe,code)).onSnapshot(function(sn){
      if(S.member!==M||M.code!==code)return;
      M.busy=false;
      if(sn.exists){M.card=sn.data();M.err='';memPut({cafe:cafe,code:code})}
      else{M.card=null;M.err='No encontramos una tarjeta con ese código en esta cafetería. Revisá el código o pedíselo en el mostrador.'}
      render();
    },function(){M.busy=false;M.err='No se pudo abrir la tarjeta. Probá de nuevo en un rato.';render()});
  }catch(_){M.busy=false;M.err='Ese código no es válido.';render()}
  render();
}
function autoMember(){var m=memGet();if(m&&m.cafe&&m.code&&!S.member.card&&DB)loadMember(m.cafe,m.code)}
function viewSocio(){
  var M=S.member,cafes=S.dir.slice();
  if(S.cafe&&S.cafeId&&!cafes.some(function(c){return c.id===S.cafeId}))cafes.push(Object.assign({id:S.cafeId},S.cafe));
  if(M.card&&M.cafeData)return viewSocioCard(M.cafeData,M.card);
  return viewSocioForm(M,cafes);
}

      '<ul class="list">'+[
        ['Estado','<span class="pill '+vg.cls+'">'+esc(vg.txt)+'</span>'],
        ['Plan','<span class="chip '+s.plan+'"><i></i>'+PLAN[s.plan].nombre+' · '+PLAN[s.plan].prod+'</span>'],

      '<div class="inline">'+(DL?'<button class="btn" data-mpng>Guardar como imagen</button>':'')+'<button class="btn" data-mclear>Cerrar sesión</button></div>'+

    '<div class="sec-h"><span class="eyebrow">Soy socio</span><h1 style="font-size:clamp(28px,4vw,40px)">Mirá tu tarjeta vigente</h1>'+
    '<p class="muted">Elegí tu cafetería y escribí el código de socio que te dieron en el mostrador.</p></div>'+

/* ---------- tarjeta como imagen ---------- */
function cardPNG(c,s){
  var cs=getComputedStyle(document.documentElement),tok=function(n){return cs.getPropertyValue(n).trim()};
  var acc=tok('--accent'),on=tok('--on-accent'),cr=tok('--crema'),bad=tok('--bad');
  var W=900,H=560,cv=document.createElement('canvas');cv.width=W*2;cv.height=H*2;var x=cv.getContext('2d');x.scale(2,2);
  function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
  var P=periodo(s),vg=vigencia(s);
  var draw=function(img){
    x.fillStyle=acc;rr(0,0,W,H,36);x.fill();
    x.save();x.beginPath();x.arc(84,84,44,0,Math.PI*2);x.clip();
    if(img){x.drawImage(img,40,40,88,88)}else{x.fillStyle=on;x.globalAlpha=.12;x.fillRect(40,40,88,88);x.globalAlpha=1;x.fillStyle=on;x.font='700 38px "Bricolage Grotesque",sans-serif';x.textAlign='center';x.fillText(initials(c.nombre),84,98);x.textAlign='left'}
    x.restore();
    x.fillStyle=on;x.font='700 34px "Bricolage Grotesque",sans-serif';x.fillText(c.nombre||'',150,78);
    x.globalAlpha=.75;x.font='400 20px "DM Sans",sans-serif';x.fillText(c.ciudad||'',150,108);
    x.fillText('Socio '+PLAN[s.plan].nombre+' · '+PLAN[s.plan].prod.toLowerCase(),44,180);x.globalAlpha=1;
    x.font='700 44px "Bricolage Grotesque",sans-serif';x.fillText(s.nombre||'',44,228);
    var st=vg.cls==='bad'?'VENCIDA':vg.cls==='warn'?'POR VENCER':'VIGENTE';x.font='700 16px "DM Sans",sans-serif';var tw=x.measureText(st).width+28;
    x.fillStyle=vg.cls==='bad'?bad:on;rr(W-44-tw,36,tw,32,16);x.fill();x.fillStyle=acc;x.fillText(st,W-44-tw+14,58);
    var cols=30,gap=5,cw=(W-88-gap*(cols-1))/cols;
    P.dias.forEach(function(d,i){var cx=44+(i%cols)*(cw+gap)+cw/2,cy=262+Math.floor(i/cols)*(cw+gap)+cw/2;x.beginPath();x.arc(cx,cy,cw/2-1,0,Math.PI*2);
      if(d.u){x.fillStyle=on;x.fill()}else{x.strokeStyle=on;x.globalAlpha=.35;x.lineWidth=1.5;if(d.f)x.setLineDash([3,3]);x.stroke();x.setLineDash([]);x.globalAlpha=1}
      if(d.t){x.beginPath();x.arc(cx,cy,cw/2+2,0,Math.PI*2);x.strokeStyle=cr;x.lineWidth=3;x.stroke()}});
    x.fillStyle=on;x.globalAlpha=.85;x.font='500 19px "IBM Plex Mono",monospace';
    x.fillText('Del '+fmtD(P.pago)+' al '+fmtD(P.fin),44,H-60);x.fillText(P.used+' de '+DUR+' cafés',44,H-32);
    x.textAlign='right';x.fillText('Canje '+(c.desde||'08:00')+'–'+(c.hasta||'12:00'),W-44,H-60);if(s.codigo)x.fillText('Código '+s.codigo,W-44,H-32);x.textAlign='left';x.globalAlpha=1;
    return new Promise(function(res,rej){cv.toBlob(function(b){b?res(b):rej()},'image/png')});
  };
  var ready=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  return ready.then(function(){
    if(!c.logo)return draw(null);
    return new Promise(function(res){var im=new Image();im.onload=function(){res(draw(im))};im.onerror=function(){res(draw(null))};im.src=c.logo});
  });
}
function savePNG(c,s){
  if(!DL)return;
  cardPNG(c,s).then(function(b){
    var slug=String(s.nombre||'socio').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    return DL.save({filename:'tarjeta-'+(slug||'socio')+'.png',data:b});
  }).then(function(){toast('Tarjeta guardada')},function(e){if(e&&e.code==='declined')return;toast('No se pudo guardar la imagen.',true)});
}


/* ---------- perfil (tienda) de cada cafetería ---------- */
var unsubTi=null;
function accRef(){var p={get:function(){return Promise.resolve({exists:false})},set:function(){return Promise.resolve()},delete:function(){return Promise.resolve()}};return p}
function openTienda(id){
  if(!id){S.view='tienda';S.tiendaId=null;S.accErr2='';render();window.scrollTo(0,0);return}
  S.view='tienda';S.tiendaId=id;S.tienda=(id===S.cafeId&&S.cafe)?S.cafe:(S.dir.find(function(c){return c.id===id})||null);S.accErr='';
  if(S.member.cafe!==id){if(unsubT){unsubT();unsubT=null}S.member={cafe:'',code:'',card:null,cafeData:null,err:'',busy:false}}
  render();window.scrollTo(0,0);
  if(!DB)return;
  if(unsubTi){unsubTi();unsubTi=null}
  unsubTi=DB.doc('cafes/'+ownerOf(id)).onSnapshot(function(sn){S.tienda=sn.exists?pickCafe(id,sn.data()):null;S.tiendaMiss=!S.tienda;if(S.member.cafe===id&&S.tienda)S.member.cafeData=S.tienda;if(S.view==='tienda')render()},function(){});
  if(S.member.card)return;
  var fallback=function(){var m=memGet();if(m&&m.cafe===id&&m.code)loadMember(id,m.code)};
  if(S.uid&&S.mode==='db'){accRef(id).get().then(function(sn){if(sn.exists&&sn.data().code)loadMember(id,sn.data().code);else fallback()},fallback)}else fallback();
}
function crearCuentaSocio(code){
  var id=S.tiendaId;S.accBusy=true;S.accErr='';render();
  DB.doc(tPath(id,code)).get().then(function(sn){
    if(!sn.exists){S.accBusy=false;S.accErr='No encontramos ese número de socio en '+((S.tienda&&S.tienda.nombre)||'esta cafetería')+'. Revisalo o pedilo en el mostrador.';render();return}
    memPut({cafe:id,code:code});
    var done=function(){S.accBusy=false;loadMember(id,code);toast('Listo, tu cuenta de socio quedó creada')};
    if(S.uid)accRef(id).set({cafe:id,code:code,creado:hoyS()}).then(done,done);else done();
  },function(){S.accBusy=false;S.accErr='No se pudo verificar el número. Probá de nuevo.';render()});
}
function salirSocio(){
  var id=S.member.cafe||S.tiendaId;if(unsubT){unsubT();unsubT=null}
  S.member={cafe:'',code:'',card:null,cafeData:null,err:'',busy:false};memPut(null);
  if(S.uid&&DB)accRef(id).delete().catch(function(){});
  render();
}

/* ---------- reglas de membresía ---------- */
function vigencia(s){
  var h=hoyS();
  var v=s.pago?addDays(s.pago,DUR):s.vence;
  if(!v) return {cls:'bad',txt:'Sin fecha'};
  var ult=addDays(v,-1);
  if(ult<h) return {cls:'bad',txt:'Vencida el '+fmtD(ult)};
  if(ult<=addDays(h,10)) return {cls:'warn',txt:'Último día '+fmtD(ult)};
  return {cls:'ok',txt:'Vigente hasta '+fmtD(ult)};
}
function ventana(){
  var c=S.cafe||{},d=new Date(),now=pad(d.getHours())+':'+pad(d.getMinutes());
  var desde=c.desde||'08:00',hasta=c.hasta||'12:00';
  return {open:now>=desde&&now<hasta,desde:desde,hasta:hasta};
}
function usoHoy(s){return (s.usos||[]).indexOf(hoyS())>=0}

function periodo(s){
  var pago=s.pago||hoyS(),h=hoyS(),u=s.usos||[],dias=[],used=0;
  for(var i=0;i<DUR;i++){var d=addDays(pago,i),k=u.indexOf(d)>=0;if(k)used++;dias.push({d:d,u:k,f:d>h,t:d===h})}
  var fin=addDays(pago,DUR-1),rest=h>fin?0:h<pago?DUR:Math.round((new Date(fin+'T12:00')-new Date(h+'T12:00'))/864e5)+1;
  return {pago:pago,fin:fin,dias:dias,used:used,rest:rest};
}
function membCard(c,example,s){

    st='<span class="st '+(vg.cls==='bad'?'bad':'')+'">'+(vg.cls==='bad'?'Vencida':vg.cls==='warn'?'Por vencer':'Vigente')+'</span>';
    head='<div><div class="cs">Socio '+PLAN[s.plan].nombre+' · '+PLAN[s.plan].prod.toLowerCase()+'</div><div class="socio" style="overflow-wrap:anywhere">'+esc(s.nombre)+'</div>'+(s.telefono?'<div class="tel">'+esc(s.telefono)+'</div>':'')+'</div>';
    meta='<span>Del '+fmtD(P.pago).slice(0,5)+' al '+fmtD(P.fin).slice(0,5)+'</span><span>'+P.used+' de '+DUR+' cafés</span><span>Canje '+esc(c.desde||'08:00')+'–'+esc(c.hasta||'12:00')+'</span>';

/* ---------- logo: recorte cuadrado y reducción ---------- */
function readLogo(file){
  return new Promise(function(res,rej){
    if(!file||!/^image\//.test(file.type))return rej('Elegí un archivo de imagen.');
    var fr=new FileReader();fr.onerror=function(){rej('No se pudo leer la imagen.')};
    fr.onload=function(){var img=new Image();img.onerror=function(){rej('No se pudo abrir la imagen.')};img.onload=function(){
      var n=Math.min(img.width,img.height),sz=240,cv=document.createElement('canvas');cv.width=cv.height=sz;
      var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,sz,sz);
      cx.drawImage(img,(img.width-n)/2,(img.height-n)/2,n,n,0,0,sz,sz);
      var out=cv.toDataURL('image/webp',.85);if(out.indexOf('image/webp')<0)out=cv.toDataURL('image/jpeg',.85);res(out)};img.src=fr.result};
    fr.readAsDataURL(file);
  });
}

/* ---------- salón: sectores, mesas, productos y tickets ---------- */
S.sl={cfg:{sectores:[],productos:[]},abiertas:{},ventas:[],sector:null,mesa:null,modo:'salon',cerrar:null,pcat:'',pq:'',ticket:null,editP:null,canjeMesa:''};
var unsubSlC=null,unsubSlM=null,unsubSlV=null;
var CAT_SUG=['Cafetería','Pastelería','Salado','Bebidas','Otros'];
function slId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function slCfgRef(){return DB.doc('cafes/'+S.cafeId+'/salon/config')}
function slMesRef(){return DB.doc('cafes/'+S.cafeId+'/salon/mesas')}
function slVenCol(){return DB.collection('cafes/'+S.cafeId+'/ventas')}
function subSalon(){
  if(unsubSlC){unsubSlC();unsubSlC=null}if(unsubSlM){unsubSlM();unsubSlM=null}if(unsubSlV){unsubSlV();unsubSlV=null}
  S.sl.cfg={sectores:[],productos:[]};S.sl.abiertas={};S.sl.ventas=[];S.sl.mesa=null;S.sl.cerrar=null;S.sl.ticket=null;
  if(!S.cafeId||!DB)return;
  unsubSlC=slCfgRef().onSnapshot(function(sn){var d=sn.exists?sn.data():{};S.sl.cfg={sectores:d.sectores||[],productos:d.productos||[],n:d.n||0};if(S.tab==='mesas'||S.sel)slRender()},function(){});
  unsubSlM=slMesRef().onSnapshot(function(sn){S.sl.abiertas=(sn.exists&&sn.data().abiertas)||{};if(S.tab==='mesas'||S.sel)slRender()},function(){});
  unsubSlV=slVenCol().where('dia','==',hoyS()).onSnapshot(function(q){S.sl.ventas=q.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return (b.n||0)-(a.n||0)});if(S.tab==='mesas')slRender()},function(){});
}
// No re-dibuja mientras se escribe en un campo del salón
function slRender(){var a=document.activeElement;if(a&&a.id&&/^sl-/.test(a.id)&&a.tagName!=='BUTTON')return;render()}
function slMesas(){var o=[];S.sl.cfg.sectores.forEach(function(s){(s.mesas||[]).forEach(function(m){o.push({sector:s,mesa:m})})});return o}
function slFind(mid){return slMesas().find(function(x){return x.mesa.id===mid})}
function slTotal(it){return (it||[]).reduce(function(a,x){return a+(Number(x.precio)||0)*(Number(x.cant)||0)},0)}
function slHora(ts){if(!ts)return '';var d=new Date(ts);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function slSaveCfg(patch){return slCfgRef().set(patch,{merge:true})}
// Cambia una mesa de forma segura aunque haya varios celulares (transacción)
function slMesaTx(mid,fn){
  var ref=slMesRef();
  return DB.runTransaction(function(tx){return tx.get(ref).then(function(sn){
    var ab=(sn.exists&&sn.data().abiertas)||{};var cur=ab[mid]?JSON.parse(JSON.stringify(ab[mid])):null;
    var nx=fn(cur);var o={};o[mid]=nx===null?firebase.firestore.FieldValue.delete():nx;
    tx.set(ref,{abiertas:o},{merge:true});
  })});
}
function slAbrir(mid){return slMesaTx(mid,function(cur){return cur||{desde:Date.now(),items:[]}})}
function slAdd(mid,item){
  return slMesaTx(mid,function(cur){
    cur=cur||{desde:Date.now(),items:[]};
    var ex=!item.socio&&cur.items.find(function(x){return x.pid===item.pid&&!x.socio});
    if(ex)ex.cant=(Number(ex.cant)||0)+1;else cur.items.push(Object.assign({k:slId('i'),cant:1},item));
    return cur;
  });
}
function slCant(mid,k,d){return slMesaTx(mid,function(cur){if(!cur)return null;cur.items=cur.items.map(function(x){if(x.k===k)x.cant=(Number(x.cant)||0)+d;return x}).filter(function(x){return x.cant>0});return cur})}

      :'<div class="empty">Este sector no tiene mesas. <button class="link" data-sl-modo="editar">Agregá mesas</button>.</div>');
}
function slMesaView(mid){
  var sl=S.sl,f=slFind(mid),a=sl.abiertas[mid],prods=sl.cfg.productos;
  var cats=[];prods.forEach(function(p){var c=p.cat||'Otros';if(cats.indexOf(c)<0)cats.push(c)});

  var items=(a&&a.items)||[],tot=slTotal(items);
  var left='<div class="card stack"><div class="inline" style="justify-content:space-between;align-items:center"><div><span class="eyebrow">'+esc(f.sector.nombre)+'</span><h2 style="margin:0">'+esc(f.mesa.nombre)+'</h2></div>'+
    (a?'<span class="pill warn">Abierta desde las '+slHora(a.desde)+'</span>':'<span class="pill ok">Libre</span>')+'</div>'+
    (items.length?'<ul class="list sl-items">'+items.map(function(x){return '<li><span style="flex:1;min-width:0">'+esc(x.nombre)+(x.socio?' <span class="pill ok">Socio</span>':'')+'<br><small class="muted">'+(x.precio?money(x.precio)+' c/u':'Sin cargo')+'</small></span>'+
      '<span class="sl-q"><button class="btn sm" data-sl-cant="'+x.k+'" data-d="-1" aria-label="Quitar uno">−</button><b class="num">'+x.cant+'</b><button class="btn sm" data-sl-cant="'+x.k+'" data-d="1" aria-label="Sumar uno"'+(x.socio?' disabled':'')+'>+</button></span><b class="num" style="min-width:84px;text-align:right">'+money(x.precio*x.cant)+'</b></li>'}).join('')+'</ul>'

  var mp=e.target.closest('[data-png],[data-mpng],[data-mclear]');if(mp){
    if(S.view==='tienda'){if(mp.hasAttribute('data-mclear'))salirSocio();else if(mp.hasAttribute('data-mpng'))savePNG(S.member.cafeData,S.member.card);return}
    if(mp.hasAttribute('data-mclear')&&S.view==='panel'){S.member.lcode=null;S.member.lcodeIn='';S.member.lerr='';render();return}
    if(mp.hasAttribute('data-mpng')&&S.view==='panel'){var lf=S.socios.find(function(z){return z.codigo===S.member.lcode});if(lf)savePNG(S.cafe,lf);return}
    if(mp.hasAttribute('data-mclear')){if(unsubT){unsubT();unsubT=null}S.member.card=null;S.member.err='';memPut(null);render();return}
    if(mp.hasAttribute('data-mpng')){savePNG(S.member.cafeData,S.member.card);return}
    var so=S.socios.find(function(z){return z.id===mp.dataset.png});if(so)savePNG(S.cafe,so);return}
  if(e.target.closest('[data-logout]')){logout();return}
  if(e.target.closest('[data-olvide]')){olvide();return}
  var rsu=e.target.closest('[data-resetu]');if(rsu&&S.soporte){S.resetU=rsu.dataset.resetu;render();var f1=$('#ru-1');if(f1)f1.focus();return}
  if(e.target.closest('[data-resetcancel]')){S.resetU=null;render();return}
  if(e.target.closest('[data-suplink]')){var cu=AUTH&&AUTH.currentUser;if(!cu)return;cu.verifyBeforeUpdateEmail(SUP_RECOVERY).then(function(){toast('Te mandamos un email a '+SUP_RECOVERY+': abrilo y confirmá con el enlace')},function(er){toast(/recent-login/.test(er&&er.code||'')?'Cerrá sesión, volvé a entrar como Ventiungo y probá de nuevo.':/already-in-use/.test(er&&er.code||'')?'Ese email ya lo usa otra cuenta.':'No se pudo vincular. Probá de nuevo.',true)});return}
  var sad=e.target.closest('[data-subadm]');if(sad&&S.soporte){var sc=(S.dirAll||[]).find(function(c){return c.id===sad.dataset.subadm});VGSubs.admin({db:DB,app:'sociocafe',sid:'sc-'+sad.dataset.subadm,nombre:sc?sc.nombre:'',onChange:loadSubs});return}
  if(e.target.closest('[data-subplans]')&&S.soporte){VGSubs.plansEditor(DB);return}
  if(e.target.closest('[data-miplan]')){VGSubs.showPlans();return}
  var sop=e.target.closest('[data-sop]');if(sop&&S.soporte){S.goHome=false;S.cafe=null;setActive(null);setActive(sop.dataset.sop);S.view='panel';render();window.scrollTo(0,0);return}
  var qu=e.target.closest('[data-quitaru]');if(qu){quitarUsuario(S.cafeId,qu.dataset.quitaru);return}
  var rb=e.target.closest('[data-rol]');if(rb){S.rol=rb.dataset.rol;render();return}
  if(e.target.closest('[data-cancelreg]')){var wasNew=S.newCafe||!S.cafe;S.newCafe=false;S.draft=null;if(wasNew){S.view='acceso';render()}else{S.view='panel';render()}return}
  if(e.target.closest('[data-newcafe]')){S.newCafe=true;S.draft=null;S.err='';S.view='registro';render();window.scrollTo(0,0);return}
  var ti=e.target.closest('[data-tienda]');if(ti){openTienda(ti.dataset.tienda);return}
  var th=e.target.closest('[data-th]');if(th){document.documentElement.setAttribute('data-theme',th.dataset.th);try{localStorage.setItem(THK,th.dataset.th)}catch(_){}header();return}
  var t=e.target.closest('[data-go],[data-tab],[data-pick],[data-act],[data-ren],[data-askdel],[data-del],[data-nodel],[data-close],#r-logo-x');if(!t)return;
  if(t.hasAttribute('data-close')){S.sel=null;render();return}
  if(t.dataset.go==='socio'){S.view='socio';render();autoMember();window.scrollTo(0,0);return}
  if(t.dataset.go==='tienda'){openTienda(null);return}
  if(t.dataset.go==='acceso'){if(AUTH&&AUTH.currentUser){AUTH.signOut();S.cafe=null;S.cafeId=null;S.sel=null}S.loginErr='';S.view='acceso';render();window.scrollTo(0,0);return}
  if(t.dataset.go){var g=t.dataset.go;if(g==='registro'){S.draft=null;S.err='';S.newCafe=false}if(g==='panel'&&!S.cafe)g='registro';S.view=g;render();window.scrollTo(0,0);return}
  if(t.dataset.tab==='tienda'){S.socios.filter(function(z){return !z.codigo}).forEach(function(z){saveSocio(Object.assign({},z)).catch(function(){})});openTienda(S.cafeId);return}
  if(t.dataset.tab==='soysocio'){S.socios.filter(function(z){return !z.codigo}).forEach(function(z){saveSocio(Object.assign({},z)).catch(function(){})})}
  if(t.dataset.tab){S.view='panel';S.tab=t.dataset.tab;if(t.dataset.tab!=='mostrador')S.sel=null;render();return}
  if(t.dataset.pick){var ps=S.socios.find(function(z){return z.id===t.dataset.pick});if(ps&&!ps.codigo)saveSocio(Object.assign({},ps)).catch(function(){});S.sel=t.dataset.pick;S.q='';S.view='panel';S.tab='mostrador';render();window.scrollTo(0,0);return}
  if(t.id==='r-logo-x'){S.draft.logo='';render();return}
  if(t.hasAttribute('data-nodel')){S.confirmDel=null;render();return}
  if(t.dataset.askdel){S.confirmDel=t.dataset.askdel;render();return}
  if(t.dataset.del){var id=t.dataset.del;S.confirmDel=null;delSocio(id).then(function(){toast('Socio dado de baja')},function(){toast('No se pudo dar de baja. Probá de nuevo.',true)});return}
  var sid=t.dataset.ren||(t.dataset.act&&S.sel);var s=sid&&S.socios.find(function(x){return x.id===sid});if(!s)return;
  if(t.dataset.act==='canje'){
    if(usoHoy(s))return;var u=(s.usos||[]).filter(function(x){return x>=addDays(hoyS(),-400)});u.push(hoyS());
    var selM=$('#sl-canjemesa');S.sl.canjeMesa=selM?selM.value:'';
    saveSocio(Object.assign({},s,{usos:u})).then(function(){toast('Café registrado para '+s.nombre);slCanjeMesa(s)},function(){toast('No se pudo registrar el café. Probá de nuevo.',true)});
  } else {
    saveSocio(Object.assign({},s,{pago:hoyS(),vence:addDays(hoyS(),DUR)})).then(function(){toast('Membresía renovada hasta '+fmtD(addDays(hoyS(),DUR-1)))},function(){toast('No se pudo renovar. Probá de nuevo.',true)});
  }
});
document.addEventListener('input',function(e){
  if(/^b-[npt]$/.test(e.target.id)){S.est[e.target.id[2]]=e.target.value;var bo=$('#b-out');if(bo)bo.innerHTML=estOut();return}
  if(e.target.id==='m-q'){S.q=e.target.value;S.sel=null;render();return}
  if(e.target.dataset.k&&S.draft){S.draft[e.target.dataset.k]=e.target.value;var side=$('.preview-side');if(side)side.innerHTML='<span class="eyebrow">Así la ven tus socios</span>'+membCard({nombre:S.draft.nombre||'Tu cafetería',ciudad:S.draft.ciudad,logo:S.draft.logo,desde:S.draft.desde,hasta:S.draft.hasta},true)}
});
document.addEventListener('change',function(e){
  if(e.target.id==='r-pub'&&S.draft){S.draft.publico=e.target.checked;return}
  if(e.target.id==='r-logo'){var f=e.target.files&&e.target.files[0];readLogo(f).then(function(u){S.draft.logo=u;S.err='';render()},function(m){S.err=m;render()})}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='f-login2'){login($('#l-user').value,$('#l-pass').value);return}
  if(e.target.classList.contains('f-setup')){var sid=e.target.dataset.id,q=function(x){return e.target.querySelector('#'+CSS.escape(x+sid))};
    setCreds(sid,q('su-').value,q('sp-').value,q('sp2-').value).then(function(){S.setupErr={};S.out=false;setActive(sid);S.view='panel';S.tab='mostrador';sesSave();render();window.scrollTo(0,0);toast('Listo. Ya podés entrar con tu usuario y contraseña.')},
      function(m){S.setupErr={};S.setupErr[sid]=m;render()});return}
  if(e.target.id==='f-adduser'){addUser(S.cafeId,$('#au-user').value,$('#au-1').value,$('#au-2').value).then(function(){render();toast('Usuario agregado')},function(m){$('#au-err').textContent=m});return}
  if(e.target.id==='f-pass'){setCreds(S.cafeId,S.user,$('#pw-1').value,$('#pw-2').value).then(function(){render();toast('Contraseña guardada')},function(m){$('#pw-err').textContent=m});return}
  if(e.target.id==='f-num'){var nc=$('#n-code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');S.member.code=nc;if(nc.length!==6){S.member.err='El número de socio tiene 6 letras y números.';render();return}buscarSocio(nc);return}
  if(e.target.id==='f-acc2'){var cf2=$('#a-cafe').value,ac2=$('#a-code2').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!cf2){S.accErr2='Elegí tu cafetería.';render();return}
    if(ac2.length!==6){S.accErr2='El número de socio tiene 6 letras y números.';render();return}
    openTienda(cf2);crearCuentaSocio(ac2);return}
  if(e.target.id==='f-resetu'){var ru=S.resetU;resetUsuario(S.cafeId,ru,$('#ru-1').value,$('#ru-2').value).then(function(){S.resetU=null;render();toast('Listo: '+ru+' ya entra con la clave nueva')},function(m){$('#ru-err').textContent=m});return}
  if(e.target.id==='f-suppass'){var cu2=AUTH&&AUTH.currentUser,o0=$('#sup-0').value,n1=$('#sup-1').value,n2=$('#sup-2').value;
    if(!cu2)return;if(!o0){$('#sup-err').textContent='Ingresá la contraseña actual.';return}
    if(n1.length<6){$('#sup-err').textContent='La contraseña nueva tiene que tener al menos 6 caracteres.';return}
    if(n1!==n2){$('#sup-err').textContent='Las contraseñas nuevas no coinciden.';return}
    cu2.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(cu2.email,o0)).then(function(){return cu2.updatePassword(n1)})
      .then(function(){render();toast('Contraseña de soporte cambiada (vale para las tres apps)')},function(er){$('#sup-err').textContent=/wrong-password|invalid-credential|invalid-login/.test(er&&er.code||'')?'La contraseña actual no es correcta.':errAuth(er)});return}
  if(e.target.id==='f-acc'){var ac=$('#a-code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(ac.length!==6){S.accErr='El número de socio tiene 6 letras y números.';render();return}crearCuentaSocio(ac);return}
  if(e.target.id==='f-soc2'){var c2=$('#m-code2').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');S.member.lcodeIn=c2;
    var hit=S.socios.find(function(z){return z.codigo===c2});
    if(!hit){S.member.lerr=c2.length!==6?'El código tiene 6 letras y números.':'No encontramos un socio con ese código. Pedilo en el mostrador.';render();return}
    S.member.lcode=c2;S.member.lerr='';render();return}
  if(e.target.id==='f-soc'){var cf=$('#m-cafe').value,cd=$('#m-code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!cf){S.member.err='Elegí tu cafetería.';render();return}
    if(cd.length!==6){S.member.code=cd;S.member.err='El código tiene 6 letras y números.';render();$('#m-code').focus();return}
    loadMember(cf,cd);return}
  if(e.target.id==='f-reg'){
    var d=S.draft;if(!String(d.nombre||'').trim()){S.err='Escribí el nombre de la cafetería.';render();$('#r-nombre').focus();return}
    if(d.desde>=d.hasta){S.err='El horario de canje tiene que terminar después de empezar.';render();return}
    var c={nombre:d.nombre.trim(),ciudad:(d.ciudad||'').trim(),direccion:(d.direccion||'').trim(),telefono:(d.telefono||'').trim(),logo:d.logo||'',desde:d.desde,hasta:d.hasta,
      precioClasica:Number(d.precioClasica)||0,precioPremium:Number(d.precioPremium)||0,precioCafe:Number(d.precioCafe)||0,precioLeche:Number(d.precioLeche)||0,publico:true,creado:(S.cafe&&S.cafe.creado)||hoyS()};
    var nuevo=!S.cafe||S.newCafe;
    if(nuevo){
      var ru=($('#r-user')||{}).value,rp=($('#r-pass')||{}).value,rp2=($('#r-pass2')||{}).value,vm=validarUsuario(ru,rp,rp2);
      if(vm){S.err=vm;render();return}
      S.busy=true;S.err='';render();
      var go=function(){return crearCafeteria(c,ru,rp)};
      (AUTH.currentUser?AUTH.signOut().then(go):go()).then(function(cid){S.busy=false;S.newCafe=false;S.draft=null;setActive(cid);S.view='panel';S.tab='socios';render();window.scrollTo(0,0);toast('Cuenta creada. Ya podés cargar socios.')},
        function(m){S.busy=false;S.err=typeof m==='string'?m:'No se pudo crear la cuenta. Probá de nuevo.';render()});
      return;
    }
    S.busy=true;S.err='';render();
    saveCafe(c,S.cafeId).then(function(){S.busy=false;S.draft=null;S.view='panel';render();window.scrollTo(0,0);toast('Cambios guardados')},
      function(){S.busy=false;S.err='No se pudo guardar. Revisá tu conexión y probá de nuevo.';render()});
    return;
  }
  if(e.target.id==='f-socio'){
    var n=$('#s-n').value.trim();if(!n){$('#s-err').textContent='Escribí el nombre del socio.';$('#s-n').focus();return}
    var pago=$('#s-d').value||hoyS();
    var s={id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),nombre:n,telefono:$('#s-t').value.trim(),plan:$('#s-p').value,pago:pago,vence:addDays(pago,DUR),usos:[]};
    saveSocio(s).then(function(){toast(n+' ya es socio');S.sel=s.id;S.q='';S.tab='mostrador';render();window.scrollTo(0,0)},function(){$('#s-err').textContent='No se pudo guardar el socio. Probá de nuevo.'});
  }
});

<script>
// ===== Instalar como app en el celular =====
var __installPrompt=null;
function appInstalada(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true}
function installBtn(){
  if(appInstalada())return '';
  return '<button class="btn sm" onclick="instalarApp()" aria-label="Instalar app en el celular" style="background:#10b981;border-color:#10b981;color:#fff;font-weight:700;border-radius:999px">'
    +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;vertical-align:-2px"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>Instalar</button>';
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();__installPrompt=e});
window.addEventListener('appinstalled',function(){__installPrompt=null;cerrarInstalar();if(typeof toast==='function')toast('¡App instalada! Ya la tenés en la pantalla de inicio');if(typeof header==='function')try{header()}catch(e){}});
function cerrarInstalar(){var m=document.getElementById('inst-modal');if(m)m.remove()}
function instalarApp(){
  if(__installPrompt){var p=__installPrompt;__installPrompt=null;try{p.prompt()}catch(e){}return}
  var ua=navigator.userAgent||'';
  var ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var pasos=ios
    ?['Abrí esta página en <b>Safari</b>.','Tocá el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba).','Elegí <b>Agregar a pantalla de inicio</b>.','Tocá <b>Agregar</b>.']
    :['Abrí esta página en <b>Chrome</b>.','Tocá los <b>tres puntitos ⋮</b> arriba a la derecha.','Elegí <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.','Confirmá con <b>Instalar</b>.'];
  cerrarInstalar();
  var m=document.createElement('div');m.id='inst-modal';
  m.setAttribute('style','position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px');
  m.innerHTML='<div role="dialog" aria-modal="true" aria-label="Instalar la app" style="background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;max-width:380px;width:100%;padding:22px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3)">'
    +'<div style="font-size:19px;font-weight:800;margin-bottom:6px">Instalar la app</div>'
    +'<div style="color:var(--muted);font-size:14px;margin-bottom:12px">Así queda en la pantalla de inicio de tu celular:</div>'
    +'<ol style="margin:0 0 18px 18px;padding:0;line-height:1.9;font-size:15px">'+pasos.map(function(p){return '<li>'+p+'</li>'}).join('')+'</ol>'
    +'<button onclick="cerrarInstalar()" class="btn" style="width:100%;background:#10b981;border-color:#10b981;color:#fff;font-weight:700">Entendido</button></div>';
  m.addEventListener('click',function(e){if(e.target===m)cerrarInstalar()});
  document.body.appendChild(m);
}
</script>
<script>
// ===== Ojo para ver la contraseña que se escribe =====
(function () {
    var OPEN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    var SHUT = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    function addEye(inp) {
        if (inp.dataset.eye) return;
        inp.dataset.eye = '1';
        var cs = getComputedStyle(inp);
        var wrap = document.createElement('span');
        wrap.style.position = 'relative';
        wrap.style.display = cs.display === 'inline' ? 'inline-block' : 'block';
        wrap.style.margin = cs.margin;
        if (cs.width && /swal2-input/.test(inp.className)) { wrap.style.width = cs.width; wrap.style.marginLeft = 'auto'; wrap.style.marginRight = 'auto'; }
        inp.parentNode.insertBefore(wrap, inp);
        wrap.appendChild(inp);
        inp.style.margin = '0';
        if (/swal2-input/.test(inp.className)) inp.style.width = '100%';
        inp.style.paddingRight = '44px';
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-label', 'Mostrar contraseña');
        b.title = 'Mostrar contraseña';
        b.innerHTML = OPEN;
        b.style.cssText = 'position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;padding:6px;cursor:pointer;color:#64748b;line-height:0;display:flex;align-items:center;justify-content:center';
        b.addEventListener('mousedown', function (e) { e.preventDefault(); });
        b.addEventListener('click', function (e) {
            e.preventDefault(); e.stopPropagation();
            var show = inp.type === 'password';
            inp.type = show ? 'text' : 'password';
            b.innerHTML = show ? SHUT : OPEN;
            b.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
            b.title = b.getAttribute('aria-label');
            inp.focus();
        });
        wrap.appendChild(b);
    }
    function scan(root) {
        var list = (root || document).querySelectorAll ? (root || document).querySelectorAll('input[type="password"]:not([data-eye])') : [];
        for (var i = 0; i < list.length; i++) addEye(list[i]);
    }
    function start() {
        scan(document);
        new MutationObserver(function () { scan(document); }).observe(document.body, { childList: true, subtree: true });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
